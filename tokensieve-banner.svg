    <animate attributeName="cy" values="95;95;95" dur="2.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.5;0.7" dur="2.1s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;4;0" keyTimes="0;0.45;0.65" dur="2.1s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="95" r="0" fill="#00d4a8" opacity="0">
    <animate attributeName="r" values="0;12;0" keyTimes="0;0.5;1" dur="2.1s" begin="1.75s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0" keyTimes="0;0.5;1" dur="2.1s" begin="1.75s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="url(#p-teal)" opacity="0.9">
    <animate attributeName="cx" values="225;453" dur="2.0s" begin="1.1s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="cy" values="115;115" dur="2.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.05;0.9;1" dur="2.0s" begin="1.1s" repeatCount="indefinite"/>
