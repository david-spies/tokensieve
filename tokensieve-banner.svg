<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>TokenSieve — Context-Deduplicating RAG Proxy</title>
<desc>Animated banner showing token streams being filtered through TokenSieve's semantic compression engine, with redundant file blocks deduplicated and replaced with compact cache references.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#040810"/>
    <stop offset="50%" stop-color="#060d1a"/>
    <stop offset="100%" stop-color="#040810"/>
  </linearGradient>
  <linearGradient id="sieve-glow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00d4a8" stop-opacity="0.9"/>
    <stop offset="50%" stop-color="#00d4a8" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#00d4a8" stop-opacity="0.9"/>
  </linearGradient>
  <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00d4a8"/>
    <stop offset="60%" stop-color="#00f0c0"/>
    <stop offset="100%" stop-color="#00d4a8"/>
  </linearGradient>
  <radialGradient id="p-red" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f87171" stop-opacity="1"/>
    <stop offset="100%" stop-color="#ef4444" stop-opacity="0.3"/>
  </radialGradient>
  <radialGradient id="p-amber" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
    <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3"/>
  </radialGradient>
  <radialGradient id="p-teal" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00d4a8" stop-opacity="1"/>
    <stop offset="100%" stop-color="#00d4a8" stop-opacity="0.2"/>
  </radialGradient>
  <radialGradient id="p-blue" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#60a5fa" stop-opacity="1"/>
    <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
  </radialGradient>
  <clipPath id="clip-left"><rect x="0" y="0" width="225" height="220"/></clipPath>
  <clipPath id="clip-right"><rect x="455" y="0" width="225" height="220"/></clipPath>
  <clipPath id="clip-sieve"><rect x="225" y="0" width="230" height="220"/></clipPath>
</defs>

<!-- Background -->
<rect width="680" height="220" fill="url(#bg)"/>

<!-- Grid overlay -->
<g opacity="0.035" stroke="#00d4a8" stroke-width="0.5">
  <line x1="0" y1="22" x2="680" y2="22"/><line x1="0" y1="44" x2="680" y2="44"/>
  <line x1="0" y1="66" x2="680" y2="66"/><line x1="0" y1="88" x2="680" y2="88"/>
  <line x1="0" y1="110" x2="680" y2="110"/><line x1="0" y1="132" x2="680" y2="132"/>
  <line x1="0" y1="154" x2="680" y2="154"/><line x1="0" y1="176" x2="680" y2="176"/>
  <line x1="0" y1="198" x2="680" y2="198"/>
  <line x1="68" y1="0" x2="68" y2="220"/><line x1="136" y1="0" x2="136" y2="220"/>
  <line x1="204" y1="0" x2="204" y2="220"/><line x1="272" y1="0" x2="272" y2="220"/>
  <line x1="340" y1="0" x2="340" y2="220"/><line x1="408" y1="0" x2="408" y2="220"/>
  <line x1="476" y1="0" x2="476" y2="220"/><line x1="544" y1="0" x2="544" y2="220"/>
  <line x1="612" y1="0" x2="612" y2="220"/>
</g>

<!-- LEFT PANEL: Raw input -->
<g clip-path="url(#clip-left)">
