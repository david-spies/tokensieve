    <animate attributeName="cy" values="135;135" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.05;0.9;1" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
