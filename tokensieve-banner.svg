    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-140" dur="6s" repeatCount="indefinite" calcMode="linear"/>
      <text x="340" y="28">a3f8c21b4d77e902</text>
      <text x="340" y="42">f2a70b5e1c883d41</text>
      <text x="340" y="56">d9e14c773b220f88</text>
      <text x="340" y="70">7c4a918e5f003b62</text>
      <text x="340" y="84">e1b2334f8d90ac71</text>
      <text x="340" y="98">2df456a0b7c1e834</text>
      <text x="340" y="112">9a8321fc0d54e276</text>
      <text x="340" y="126">b5cc70e1392fa841</text>
      <text x="340" y="140">a3f8c21b4d77e902</text>
      <text x="340" y="154">f2a70b5e1c883d41</text>
      <text x="340" y="168">d9e14c773b220f88</text>
      <text x="340" y="182">7c4a918e5f003b62</text>
      <text x="340" y="196">e1b2334f8d90ac71</text>
    </g>
  </g>
</g>

<!-- RIGHT PANEL: Compressed output -->
<g clip-path="url(#clip-right)">
