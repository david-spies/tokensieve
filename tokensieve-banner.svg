  </circle>
  <circle r="3" fill="url(#p-amber)" opacity="0.8">
    <animate attributeName="cx" values="225;453" dur="2.4s" begin="0.3s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="cy" values="75;75" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.05;0.9;1" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
