    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-40;0,-40" keyTimes="0;0.45;1" dur="4s" repeatCount="indefinite" calcMode="linear"/>
      <text x="12" y="42" fill="#ef4444" opacity="0.9">--- BEGIN FILE src/main.go</text>
      <text x="12" y="55" fill="#475569">package main</text>
      <text x="12" y="68" fill="#475569">import (</text>
      <text x="12" y="81" fill="#60a5fa">  "net/http"</text>
      <text x="12" y="94" fill="#60a5fa">  "encoding/json"</text>
      <text x="12" y="107" fill="#475569">)</text>
      <text x="12" y="120" fill="#ef4444" opacity="0.9">--- END FILE</text>
      <text x="12" y="133" fill="#fbbf24" opacity="0.8">Error: exit status 1</text>
      <text x="12" y="146" fill="#64748b">goroutine 1 [running]:</text>
      <text x="12" y="159" fill="#64748b">main.main()</text>
      <text x="12" y="172" fill="#ef4444" opacity="0.9">--- BEGIN FILE src/main.go</text>
      <text x="12" y="185" fill="#475569">package main</text>
      <text x="12" y="198" fill="#475569">import (</text>
      <text x="12" y="211" fill="#60a5fa">  "net/http"</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,160;0,120;0,80" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite" calcMode="linear"/>
      <text x="12" y="42" fill="#ef4444" opacity="0.9">--- BEGIN FILE src/main.go</text>
      <text x="12" y="55" fill="#475569">package main</text>
      <text x="12" y="68" fill="#475569">import (</text>
      <text x="12" y="81" fill="#60a5fa">  "net/http"</text>
      <text x="12" y="94" fill="#60a5fa">  "encoding/json"</text>
    </g>
  </g>
  <rect x="0" y="0" width="225" height="28" fill="url(#bg)"/>
  <rect x="0" y="192" width="225" height="28" fill="url(#bg)"/>
  <g opacity="0.0">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.2;0.35;0.65;1" dur="4s" repeatCount="indefinite"/>
    <rect x="140" y="36" width="60" height="14" rx="3" fill="#7f1d1d"/>
    <text x="170" y="46" text-anchor="middle" fill="#fca5a5" font-family="'JetBrains Mono',monospace" font-size="8" font-weight="700">DUPLICATE</text>
    <rect x="140" y="166" width="60" height="14" rx="3" fill="#7f1d1d"/>
    <text x="170" y="176" text-anchor="middle" fill="#fca5a5" font-family="'JetBrains Mono',monospace" font-size="8" font-weight="700">DUPLICATE</text>
  </g>
  <rect x="8" y="196" width="92" height="16" rx="3" fill="#1a1030"/>
  <text x="12" y="207" fill="#ef4444" font-family="'JetBrains Mono',monospace" font-size="9">~12,400 tokens</text>
  <g opacity="0.7">
    <line x1="210" y1="110" x2="222" y2="110" stroke="#ef4444" stroke-width="1.5"/>
    <polygon points="222,106 228,110 222,114" fill="#ef4444"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.4s" repeatCount="indefinite"/>
  </g>
</g>

<!-- CENTER: Sieve engine -->
<g clip-path="url(#clip-sieve)">
  <rect x="230" y="20" width="220" height="180" rx="12" fill="#060f1e" stroke="#00d4a8" stroke-width="1.2" stroke-opacity="0.6"/>
  <g stroke="#00d4a8" stroke-width="0.5" stroke-opacity="0.25">
