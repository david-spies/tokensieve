    <line x1="290" y1="20" x2="290" y2="200"/><line x1="310" y1="20" x2="310" y2="200"/>
    <line x1="330" y1="20" x2="330" y2="200"/><line x1="350" y1="20" x2="350" y2="200"/>
    <line x1="370" y1="20" x2="370" y2="200"/><line x1="390" y1="20" x2="390" y2="200"/>
