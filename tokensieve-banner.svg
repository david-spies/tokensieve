      <animateTransform attributeName="transform" type="translate" values="0,0;0,-30;0,-30" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite" calcMode="linear"/>
      <text x="460" y="42" fill="#00d4a8" opacity="0.9">[TS:FILE_CACHE</text>
      <text x="460" y="55" fill="#00d4a8" opacity="0.7">  ref=a3f8c21b</text>
      <text x="460" y="68" fill="#4b9e8a" opacity="0.7">  saved≈3100tok]</text>
      <text x="460" y="86" fill="#00d4a8" opacity="0.9">[TS:TRACE_CACHE</text>
      <text x="460" y="99" fill="#00d4a8" opacity="0.7">  ref=f2a70b5e</text>
      <text x="460" y="112" fill="#4b9e8a" opacity="0.7">  saved≈820tok]</text>
