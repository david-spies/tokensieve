  <text x="636" y="19" text-anchor="middle" fill="#00d4a8" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="500">COMPRESSED</text>
  <g opacity="0.85" font-family="'JetBrains Mono','Fira Code',monospace" font-size="9">
