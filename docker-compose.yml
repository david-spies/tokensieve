version: '3.9'

services:
  # ── Core Deduplication Proxy ─────────────────────────────────────────────
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    image: tokensieve-proxy:latest
    container_name: tokensieve-proxy
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - UPSTREAM_API_KEY=${API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - TOKENSIEVE_ADMIN_KEY=${TOKENSIEVE_ADMIN_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Admin Telemetry Dashboard ────────────────────────────────────────────
  dashboard:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: tokensieve-dashboard:latest
    container_name: tokensieve-dashboard
    ports:
      - "3000:3000"
    environment:
      - VITE_PROXY_URL=http://localhost:8080
    depends_on:
      proxy:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: tokensieve-net
